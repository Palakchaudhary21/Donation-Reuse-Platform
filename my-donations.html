<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Donations | ReWear</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<header class="details-header">

    <a href="index.html" class="back-btn">

        <i class="fa-solid fa-arrow-left"></i>

        Back

    </a>

</header>

<section class="request-history">

    <h1>My Donations</h1>

    <div id="donationContainer"></div>

    <p id="emptyMessage">

        You haven't donated any items yet.

    </p>

</section>
<!-- ================= EDIT MODAL ================= -->

<div class="edit-modal" id="editModal">

    <div class="edit-modal-content">

        <span class="close-edit">&times;</span>

        <h2>Edit Donation</h2>

        <form id="editForm">

            <input
                type="text"
                id="editName"
                placeholder="Item Name"
                required>

            <input
                type="text"
                id="editCategory"
                placeholder="Category"
                required>

            <input
                type="text"
                id="editLocation"
                placeholder="Location"
                required>

            <input
                type="text"
                id="editCondition"
                placeholder="Condition"
                required>

            <textarea
                id="editDescription"
                rows="4"
                placeholder="Description"
                required></textarea>

            <button type="submit" class="save-btn">

                Save Changes

            </button>

        </form>

    </div>

</div>

<!-- ================= DELETE CONFIRMATION MODAL ================= -->

<div class="delete-modal" id="deleteModal">

    <div class="delete-modal-content">

        <div class="delete-icon">

            <i class="fa-solid fa-trash"></i>

        </div>

        <h2>Delete Donation?</h2>

        <p>
            Are you sure you want to delete this donation?
        </p>

        <div class="delete-actions">

            <button id="cancelDelete" class="cancel-delete">
                Cancel
            </button>

            <button id="confirmDelete" class="confirm-delete">
                Yes, Delete
            </button>

        </div>

    </div>

</div>

<script src="js/my-donations.js"></script>

</body>

</html>
